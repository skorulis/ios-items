# SwiftLint configuration for Items
# https://github.com/realm/SwiftLint

# Paths to exclude from linting
excluded:
  - Items/Resource/XCAssets+Generated.swift  # SwiftGen generated

# Optional: paths to include (default is all Swift files)
# included:
#   - Items

# Treat warnings as errors (set to true for strict CI)
strict: false

# Line length: warning at 120, error at 150
line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_comments: true
